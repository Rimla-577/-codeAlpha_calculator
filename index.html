<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="cal">
        <div class="calc">

            <div class="display">
                <div class="expression" id="expression">&nbsp;</div>
                <div class="result" id="result">0</div>
            </div>
            <!-- buttons -->
            <div class="grid">

                <button class="btn func" data-action="clear">C</button>
                <button class="btn func" data-action="delete">DEL</button>
                <button class="btn func" data-value="%">%</button>
                <button class="btn op" data-value="/">÷</button>

                <button class="btn" data-value="7">7</button>
                <button class="btn" data-value="8">8</button>
                <button class="btn" data-value="9">9</button>
                <button class="btn op" data-value="*">×</button>

                <button class="btn" data-value="4">4</button>
                <button class="btn" data-value="5">5</button>
                <button class="btn" data-value="6">6</button>
                <button class="btn op" data-value="-">−</button>

                <button class="btn" data-value="1">1</button>
                <button class="btn" data-value="2">2</button>
                <button class="btn" data-value="3">3</button>
                <button class="btn op" data-value="+">+</button>

                <button class="btn span2" data-value="0">0</button>
                <button class="btn" data-value=".">.</button>
                <button class="btn equals" data-action="equals">=</button>
                <script src="script.js"></script>
            </div>
        </div>
    </div>
</body>

</html>
